name: Experiment checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - name: Run experiment scripts
        run: |
          python train.py --config configs/grpo.toml --output runs/smoke --iterations 2
          python evaluate.py --checkpoint runs/smoke/policy.npz --episodes 16
